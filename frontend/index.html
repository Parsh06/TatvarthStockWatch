<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon-light" rel="icon" type="image/png" href="/logo2-black.png" media="(prefers-color-scheme: light)" />
    <link id="app-favicon-dark" rel="icon" type="image/png" href="/logo2.png" media="(prefers-color-scheme: dark)" />
    <link id="app-favicon" rel="icon" type="image/png" href="/logo2-black.png" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StockWatch" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="StockWatch" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
          var doc = document.documentElement;
          var manifest = document.getElementById('app-manifest');
          var fav = document.getElementById('app-favicon');
          var appleIcon = document.getElementById('apple-touch-icon');
          if (isDark) {
            doc.classList.add('dark');
            if (manifest) manifest.setAttribute('href', '/manifest-dark.json');
            if (fav) fav.setAttribute('href', '/logo2.png');
            if (appleIcon) appleIcon.setAttribute('href', '/apple-touch-icon-dark.png');
          } else {
            doc.classList.remove('dark');
            if (manifest) manifest.setAttribute('href', '/manifest.json');
            if (fav) fav.setAttribute('href', '/logo2-black.png');
            if (appleIcon) appleIcon.setAttribute('href', '/apple-touch-icon.png');
          }
        } catch (e) {}
      })();
    </script>
    <title>TatvarthStockWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
