name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'package.json'
      - 'render.yaml'
      - '.node-version'
      - '.github/workflows/deploy-render.yml'

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL || 'https://api.render.com/deploy/srv-db8sq3navr4c73c7jjf0?key=vIFx_6LAyXc' }}
        run: |
          echo "Triggering instant Render deployment for Tatvarth StockWatch..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy hook successfully received by Render (HTTP $HTTP_STATUS)"
          else
            echo "Warning: Render hook returned HTTP $HTTP_STATUS"
          fi
