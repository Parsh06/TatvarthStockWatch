name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'
      - 'README.md'
      - '.gitignore'

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering instant Render deployment for Tatvarth StockWatch..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy hook successfully received by Render (HTTP $HTTP_STATUS)"
          else
            echo "Warning: Render hook returned HTTP $HTTP_STATUS"
          fi
